version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: a4pm-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_NAME:-teste_receitas_rg_sistemas}
    ports:
      - "${DB_PORT_PUBLISH:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 3s
      retries: 30

  adminer:
    image: adminer
    container_name: a4pm-adminer
    depends_on:
      - mysql
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    container_name: a4pm-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-teste_receitas_rg_sistemas}
      BCRYPT_SALT_ROUNDS: 12
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        VUE_APP_API_BASE: /api
        NODE_ENV: production
    container_name: a4pm-web
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  dbdata:
